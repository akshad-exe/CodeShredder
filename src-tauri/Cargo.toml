[package]
name = "codeshredder"
version = "0.1.2"
description = "Fast, safe desktop cleanup for developers"
default-run = "codeshredder"
edition = "2021"
license = "MIT"
repository = "https://github.com/akshad-exe/CodeShredder"

[lib]
name = "codeshredder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Content hashing (duplicate detection)
blake3 = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# File system
dunce = "1"
jwalk = "0.9"
directories = "5"

# Parallelism
rayon = "1"

# Trash
trash = "5"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Elevated (UAC) execution for WSL diskpart compaction
[target.'cfg(target_os = "windows")'.dependencies]
runas = "1"

# Clippy lints
[lints]
workspace = true

[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "deny"
unused = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
large_enum_variant = { level = "warn", priority = 8 }
needless_collect = { level = "deny", priority = 7 }
clone_on_copy = { level = "deny", priority = 6 }
manual_ok_or = { level = "deny", priority = 5 }
unnecessary_wraps = { level = "warn", priority = 4 }
pedantic = { level = "warn", priority = 3 }
nursery = { level = "warn", priority = 2 }
