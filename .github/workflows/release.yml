name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos
          - platform: ubuntu-22.04
            os: linux
          - platform: windows-latest
            os: windows

    runs-on: ${{ matrix.platform }}

    steps:
      # Checkout full history (needed for proper tagging/version checks)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every manifest must carry the tag's version (beta/alpha/rc suffixes allowed)
      - name: Ensure tag matches all version files
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          BASE=$(echo "$TAG" | sed -E 's/-[a-z]+\.[0-9]+$//')
          for f in package.json desktop/package.json src-tauri/tauri.conf.json; do
            V=$(node -p "require('./$f').version")
            [ "$V" = "$BASE" ] || { echo "$f is $V, tag is $TAG"; exit 1; }
          done
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$V" = "$BASE" ] || { echo "Cargo.toml is $V, tag is $TAG"; exit 1; }

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Cache Bun dependencies
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      # Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Setup Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Cache Rust dependencies
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux system deps
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # Windows long path fix
      - name: Enable long paths (Windows)
        if: matrix.os == 'windows'
        run: git config --system core.longpaths true

      # Build and upload release assets
      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.os == 'macos' && '--target universal-apple-darwin' || '' }}
          uploadUpdaterJson: true

      # Generate per-OS checksums over all produced bundles
      - name: Generate release checksums
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            # macOS universal builds use a different target path
            BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"
          fi
          if [ -d "$BUNDLE_DIR" ]; then
            cd "$BUNDLE_DIR"
            # Bare file names, so `sha256sum -c` works next to the downloaded assets.
            find . -type f -exec sha256sum {} \; | sed 's|\./.*/||' > "$GITHUB_WORKSPACE/checksums-${{ matrix.os }}.sha256"
          else
            echo "Bundle directory not found, skipping checksums"
          fi

      - name: Upload checksum file
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "checksums-${{ matrix.os }}.sha256" ]; then
            gh release upload "${{ github.event.release.tag_name }}" \
              "checksums-${{ matrix.os }}.sha256" --clobber
          else
            echo "Checksum file not found, skipping upload"
          fi