name: Data loss / safety concern
description: CodeShredder offered to delete, or deleted, something it should not have
title: "[SAFETY] "
labels: [bug, high-priority]
body:
  - type: markdown
    attributes:
      value: For general bugs use the bug report. If this is exploitable, report it privately through the Security tab.
  - type: textarea
    attributes:
      label: What was offered for deletion
      description: The exact path. You may replace your user name, but keep the structure.
    validations: { required: true }
  - type: textarea
    attributes:
      label: Why it should have been protected
    validations: { required: true }
  - type: dropdown
    attributes:
      label: What happened to the files
      options: [Nothing was deleted, Moved to Trash, Permanently deleted]
    validations: { required: true }
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    attributes:
      label: CodeShredder version, OS and architecture
    validations: { required: true }
  - type: textarea
    attributes:
      label: Logs
      render: text
